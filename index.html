<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eFinMoney — Send Money Across Borders</title>
    <meta name="description" content="Send money globally with eFinMoney. Multi-currency wallets, FX trading, crypto, and mobile money transfers. Bank-grade security." />
    <meta name="keywords" content="mobile money, money transfer, remittance, FX, crypto, wallet, eFinMoney" />
    <meta name="author" content="eFinMoney" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Open Graph -->
    <meta property="og:title" content="eFinMoney" />
    <meta property="og:description" content="Multi-currency wallets, FX trading, crypto, and mobile money transfers" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/apple-touch-icon.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@eFinMoney" />
    <meta name="twitter:title" content="eFinMoney" />

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <style>
      #initial-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 350ms ease-out;
      }
      #initial-splash.is-hiding { opacity: 0; pointer-events: none; }
      #initial-splash .ring {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        border: 4px solid rgba(255, 255, 255, 0.12);
        border-top-color: #FFD700;
        animation: splash-spin 0.9s linear infinite;
      }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
    </style>
    <div id="initial-splash"><div class="ring"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
