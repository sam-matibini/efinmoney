<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eFinMoney — Send Money Across Borders</title>
    <meta name="description" content="Send money globally with eFinMoney. Multi-currency wallets, FX trading, crypto, and mobile money transfers. Bank-grade security." />
    <meta name="keywords" content="mobile money, money transfer, remittance, FX, crypto, wallet, eFinMoney" />
    <meta name="author" content="eFinMoney" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f7f8fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b2a6f" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph -->
    <meta property="og:title" content="eFinMoney" />
    <meta property="og:description" content="Multi-currency wallets, FX trading, crypto, and mobile money transfers" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/apple-touch-icon.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@eFinMoney" />
    <meta name="twitter:title" content="eFinMoney" />
    <meta name="twitter:description" content="Multi-currency wallets, FX trading, crypto, and mobile money transfers" />
    <meta name="twitter:image" content="/apple-touch-icon.png" />

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="/geo/ne_110m_land.json" as="fetch" crossorigin />
    <link rel="preload" href="/geo/ne_110m_land_dots_compact.json" as="fetch" crossorigin />
  </head>
  <body>
    <style>
      #initial-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #07122e;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 350ms ease-out;
      }
      #initial-splash.is-hiding { opacity: 0; pointer-events: none; }
      #initial-splash video {
        width: 140px;
        height: 140px;
        mix-blend-mode: screen;
      }
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("efinmoney-theme");
          var dark =
            stored === "dark" ||
            (!stored && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.style.setProperty("color-scheme", "dark");
          }
        } catch (e) {}
      })();
    </script>
    <div id="initial-splash">
      <video src="/spinner.webm" autoplay loop muted playsinline width="140" height="140"></video>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
