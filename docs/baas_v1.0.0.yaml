                        "message": "Card reissue in progress",
                        "field": ""
                      }
                    ],
                    "message": ""
                  }
                  description: >-
                    This error occurs when multiple requests are made
                    in quick succession to reissue a user's card.
                ReissueLimitReached:
                  value: {
                    "status": "error",
                    "errors": [
                      {
                        "code": 20098,
                        "message": "Reissue limit reached",
                        "field": ""
                      }
                    ],
                    "message": ""
                  }
                  description: >-
                    > ### ❗️ WARNING
                    >
                    > Do not surface this error to the end user
                    > since a fraudster could use this to learn the ATO prevention rules.
                    > Map these error codes to a more generic error.

                    This error occurs when the user has reached their
                    daily and weekly limit to issue their cards.
                ProfileRcentlyUpdated:
                  value: {
                    "status": "error",
                    "errors": [
                      {
                        "code": 20097,
                        "message": "Failed to reissue card due to recent user profile update",
                        "field": ""
                      }
                    ],
                    "message": ""
                  }
                  description: >-
                    > ### ❗️ WARNING
                    >
                    > Do not surface this error to the end user
                    > since a fraudster could use this to learn the ATO prevention rules.
                    > Map these error codes to a more generic error.

                    This error occurs when the user has recently updated
                    their profile and try to re-issue a card.
      deprecated: false
  /baas/users/{payfare_id}/cards/{card_id}/transactions:
    get:
      x-group-name: BaaS Endpoints
      x-proxy-name: Get Transactions
      summary: Get Transactions
      description: >-
        <p>Use this endpoint to retrieve transaction line items associated with the
        cardholder between specific dates.</p>
        <p>Note: At any given time, the maximum query range spanning
        from the <strong>from_datetime</strong> and the <strong>to_datetime</strong> is 30 days.
        Starting from the current day, up to a year&#39;s worth of transactions
        can be queried with the <strong>from_datetime</strong> and <strong>to_datetime</strong> split
        into &lt;= 30 day intervals.
        If the <strong>from_datetime</strong> goes well beyond the year, it will be automatically capped.
        Please note, due to compliance and regulatory rules,
        the request to view this data must originate from the cardholder.</p>
      operationId: get_card_transactions
      parameters:
        - $ref: "#/components/parameters/InternalUserId"
        - $ref: "#/components/parameters/CardId"
        - name: status
          in: query
          description: >-
            Transaction type that you wish to pull. Sending "all" returns posted
            and pending transactions.  Likewise, sending "posted" or "pending"
            will return the corresponding transactions of that type.
          schema:
            type: string
            enum:
              - all
              - posted
              - pending
            example: all
        - $ref: "#/components/parameters/FromDateTime"
        - $ref: "#/components/parameters/ToDateTime"
        - $ref: "#/components/parameters/ClientKey"
        - $ref: "#/components/parameters/ClientSecret"
      responses:
        '200':
          description: 200 Response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessfulRequest"
                  - properties:
                      data:
                        type: object
                        properties:
                          transactions:
                            type: array
                            description: The user's transactions.
                            items:
                              type: object
                              properties:
                                transaction_id:
                                  type: string
                                  description: A unique identifier representing the transaction.
                                  example: F2164684129
                                transaction_type_id:
                                  type: string
                                  description: >-
                                    <p>A numerical identifier representing the transaction type.</p>
                                    <h3>Transaction Types</h3>
                                    <table>
                                      <thead>
                                        <tr>
                                          <th style="text-align:left">Code</th><th style="text-align:left">Type</th>
                                        </tr>
                                      </thead>
                                      <tbody>
                                        <tr>
                                          <td style="text-align:left">00</td><td style="text-align:left">POS</td>
                                        </tr>
                                        <tr>
                                          <td style="text-align:left">BP</td><td style="text-align:left">Bill Pay</td>
                                        </tr>
                                        <tr>
                                          <td style="text-align:left">47</td><td style="text-align:left">ACH</td>
                                        </tr>
                                        <tr>
                                          <td style="text-align:left">46</td><td style="text-align:left">ACH Reverse</td>
                                        </tr>
                                        <tr>
                                          <td style="text-align:left">40</td><td style="text-align:left">Goal Transfer</td>
                                        </tr>
                                        <tr>
                                          <td style="text-align:left">25</td><td style="text-align:left">Payout</td>
                                        </tr>
                                        <tr>
                                          <td style="text-align:left">RC</td><td style="text-align:left">Reissue Card</td>
                                        </tr>
                                        <tr>
                                          <td style="text-align:left">CW</td><td style="text-align:left">Rewards Credit</td>
                                        </tr>
                                        <tr>
                                          <td style="text-align:left">01</td><td style="text-align:left">Cash Withdrawal</td>
                                        </tr>
                                        <tr>
                                          <td style="text-align:left">28</td><td style="text-align:left">Prepaid Activation and Load</td>
                                        </tr>
                                        <tr>
                                          <td style="text-align:left">21</td><td style="text-align:left">Load Money Onto Card</td>
                                        </tr>
                                        <tr>
                                          <td style="text-align:left">W1</td><td style="text-align:left">Card Replacement Fee</td>
                                        </tr>
                                        <tr>
                                          <td style="text-align:left">Q1</td><td style="text-align:left">Card Replacement Fee Reversal</td>
                                        </tr>
                                        <tr>
                                          <td style="text-align:left">W2</td><td style="text-align:left">Dormancy Fee</td>
                                        </tr>
                                        <tr>
                                          <td style="text-align:left">Q2</td><td style="text-align:left">Dormancy Fee Reversal</td>
                                        </tr>
                                        <tr>
                                          <td style="text-align:left">X2</td><td style="text-align:left">Card to Card Transfer</td>
                                        </tr>
                                      </tbody>
                                    </table>
                                  enum:
                                    - "00"
                                    - BP
                                    - "47"
                                    - "46"
                                    - "40"
                                    - "25"
                                    - RC
                                    - CW
                                    - "01"
                                    - "28"
                                    - "21"
                                    - W1
                                    - Q1
                                    - W2
                                    - Q2
                                    - X2
                                  example: "25"
                                remaining_balance:
                                  type: number
                                  description: Sum amount of posted/cleared transactions.
                                  format: float
                                  example: 25.0
                                available_balance:
                                  type: number
                                  description: Remaining balance minus any funds on hold (pre-auth).
                                  format: float
                                  example: 25.0
                                amount:
                                  type: number
                                  description: >-
                                    The transaction line item amount formatted in the card program's default currency.
                                  format: float
                                  example: 25.0
                                transaction_date:
                                  type: string
                                  description: >-
                                    The date of when the transaction occurred in iso format.
                                    The timezone will always be in UTC.
                                  format: date-time
                                  example: 2023-08-08T18:41:02+00:00
                                description:
                                  type: string
                                  description: Human readable string which describes the transaction.
                                  example: DoorDash Direct Deposit
                                merchant_name:
                                  type: string
                                  description: The name of the merchant (for POS transactions).
                                  nullable: true
                                  example: ""
                                mcc_category:
                                  type: string
                                  description: String representation of the MCC category.
                                  example: Other
                                status:
                                  type: string
                                  description: >-
                                    String that determines whether the transaction is posted or pending
                                  example: Posted
                          meta:
                            type: object
                            properties:
                              has_transactions:
                                type: boolean
                                description: >-
                                  Boolean field which gives quick insight into whether
                                  there are transactions for the selected timeframe as specified.
                                example: true
                              closing_balance:
                                type: number
                                description: >-
                                  The closing balance for the selected timeframe as specified.
                                format: float
                                example: 25.0
                              opening_balance:
                                type: number
                                description: >-
                                  The opening balance for the selected timeframe as specified.
                                format: float
                                example: 0.0
        '400':
          $ref: "#/components/responses/400UserNotFound"
      deprecated: false
  /baas/users/{payfare_id}/transaction-details/{transaction_id}:
    get:
      x-group-name: BaaS Endpoints
      x-proxy-name: Get Transaction Details
      summary: Get Transaction Details
      description: >-
        This endpoint returns more granular details about the transaction line
        item.

        <blockquote>
          <h5>💰Cash Advances</h5>

          Any POS transaction that has a cash advance
          (<em>also commonly referred to as "Cash Back"</em>
          not to be confused with cash back from rewards)
          amount, will have values for
          <strong>cash_withdrawal</strong> and <strong>purchase_amount</strong>.
          Note that the sum of cash_withdrawal and purchase_amount is equal to the
          <strong>transaction_total</strong>.

          For display purposes, it is recommended that you always display
          the <strong>transaction_total</strong> as the official amount for
          the transaction line item.
          The values given for <strong>cash_withdrawal</strong>
          and <strong>purchase_amount</strong> are to be used
          for the granular breakdown.

          If the POS transaction is not associated with a cash advance,
          then cash_withdrawal and purchase_amount will be null.
        </blockquote>

        <blockquote>
          <h5>🔻ACH Transfers</h5>

          If the transaction line item is an ACH transfer,
          the fields <strong>ach_status</strong>, <strong>ach_transfer_id</strong>
          and <strong>can_cancel</strong> would be populated.
        </blockquote>
      operationId: get_transaction_details
      parameters:
        - $ref: "#/components/parameters/InternalUserId"
        - name: transaction_id
          in: path
          description: >-
            The unique id of the transaction. For reward redemptions, the value
            would be "redemption"
          schema:
            type: string
            example: F32836565
          required: true
        - $ref: "#/components/parameters/ClientKey"
        - $ref: "#/components/parameters/ClientSecret"
      responses:
        '200':
          description: 200 Response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessfulRequest"
                  - properties:
                      data:
                        type: object
                        properties:
                          transaction_id:
                            oneOf:
                              - type: number
                                format: int64
                                example: 878579343
                              - type: string
                                enum: [redemption]
                                example: redemption
                            description: >-
                              A unique string ID used to identify this transaction.
                              This is same value that you used to query for this transaction.
                              For all reward redemptions, transaction_id will be "redemption".
                          partner_source:
                            type: string
                            description: >-
                              For cash back rewards that are powered by the card networks (Visa or Mastercard),
                              the value for partner source will be **savings-edge** which represents
                              [Visa's SavingsEdge Reward Program](https://www.visasavingsedge.ca/e/members/registration.php)
                              or **easy-savings** which represents
                              [Mastercard's Easy Savings Reward Program](https://www.priceless.com/easy-savings).

                              For all other transactions,
                              including rewards that are funded by the integrating partner (you),
                              the value will be your name.
                              For example if  your company name is **"Stark Industries"**,
                              the value will be **"stark"**.
                            example: partner_name
                          tranasaction_date:
                            type: string
                            description: >-
                              The date time in iso format of when the transaction occurred in UTC.
                            format: date-time
                            example: 2023-08-08T18:41:02+00:00
                          merchant_name:
                            type: string
                            description: The name of the merchant (for POS transactions).
                            example: POKEMON STORE
                          status:
                            type: string
                            description: >-
                              The status of the transaction.
                              Values can be **Pending**, **Posted**, **Refund** and **Service Fee**.
                            enum:
                              - Pending
                              - Posted
                              - Refund
                              - Service Fee
                            example: Posted
                          category:
                            type: string
                            description: >-
                              Human readable translations of MCC codes.
                              For example the value can be:
                              **Gas**, **Grocery**, **Dining**, **Automotive**, **Drugstores and pharmacy**, etc.
                            example: Gas
                          transaction_total:
                            type: number
                            description: The total amount of the transaction line item.
                            format: float
                            example: 1000.0
                          posted_date:
                            type: string
                            description: >-
                              The date time in iso format of when the transaction became posted in UTC.
                              For non-posted transactions, this field will be null.
                            format: date-time
                            nullable: true
                            example: 2023-08-08T09:27:47+00:00
                          cash_withdrawal:
                            type: number
                            description: >-
                              The cash advance amount.
                              If no cash advance was performed by the cardholder, this field will be **null**.
                            format: float
                            nullable: true
                            example: null
                          purchase_amount:
                            type: number
                            description: >-
                              The amount for the POS portion of the transaction → **transaction_total - cash_withdrawal = purchase_amount**.
                              If no cash advance was performed by the cardholder, this field will be **null**.
                            format: float
                            nullable: true
                            example: null
                          reward_tier:
                            type: string
                            description: The reward tier of the user at the time of transaction.
                            example: Platinum
                          rewards_earned:
                            type: number
                            description: >-
                              The cash back reward amount earned on this transaction if eligible.
                              Otherwise this field will be **null**.
                            format: float
                            nullable: true
                            example: 100.0
                          reward_percentage:
                            type: number
                            description: >-
                              The percentage that was applied against the purchase_amount
                              if cash advance was performed or against the transaction_total
                              to calculate the rewards_earned if eligible.
                              Otherwise this field will be **null**.
                            format: float
                            nullable: true
                            example: 10.0
                          reward_id:
                            type: string
                            description: >-
                              The id of cash back reward associated with this transaction if eligible.
                              Otherwise this field will be **null**.
                            format: uuid
                            nullable: true
                            example: 8836faed-9b53-472e-b9c3-ca82f7b47834
                          ach_status:
                            type: string
                            description: >-
                              The status of the ach transfer.
                              Values can be:
                              **status, withdrawal-fail, refund-failed, withdrawal-processing, submitted,
                              cancelling, processing, processing-critical, refund-processing, refunded,
                              processing-fail, initiated, withdrawal-success, withdrawal-critical**.
                              If the transaction is not an ACH, this will be null.
                            enum:
                              - status
                              - withdrawal-fail
                              - refund-failed
                              - withdrawal-processing
                              - submitted
                              - cancelling
                              - processing
                              - processing-critical
                              - refund-processing
                              - refunded
                              - processing-fail
                              - initiated
                              - withdrawal-success
                              - withdrawal-critical
                              - null
                            nullable: true
                            example: null
                          ach_transfer_id:
                            type: string
                            description: >-
                              The id of the ACH transfer.  If the transaction is not an ACH, this will be null.
                            example: null
                          ach_can_cancel:
                            type: boolean
                            description: >-
                              A boolean that determines whether or not the ACH can be cancelled.
                              If the transaction is not an ACH, this will be null.
                            example: false
        '400':
          $ref: "#/components/responses/400UserNotFound"
      deprecated: false
