openapi: 3.0.3
info:
  title: BaaS API
  version: '1.0'
servers:
  - url: https://api.uat.payfarelabs.com
components:
  schemas:
    Address:
      type: object
      properties:
        address_line1:
          type: string
          description: The street address.
          minLength: 1
          maxLength: 255
          example: 123 River St.
        address_line2:
          type: string
          description: Optional address line for apartment number, suite, room, floor etc...
          maxLength: 255
          nullable: true
          example: ""
        city:
          type: string
          description: The name of the city.
          minLength: 1
          maxLength: 255
          example: Toronto
        region:
          type: string
          description: The region which is the short code for the state or province. (ISO-3166-2 subdivision code)
          minLength: 2
          maxLength: 2
          example: 'ON'
        country_code:
          type: string
          description: Short code representing the country of the shipping address. (ISO-3166-1 Alpha-2 country code)
          minLength: 2
          maxLength: 2
          example: CA
        postal_code:
          type: string
          description: >-
            The zip code or postal code of the address.<br/>

            "A1A1A1" - Canada<br/>
            "NNNNN" - US<br/>
            "NNNNN-NNNN" - US<br/>
          minLength: 5
          maxLength: 10
          example: AB123
      required:
        - address_line1
        - city
        - region
        - country_code
        - postal_code
    ExternalUserId:
      type: object
      properties:
        external_id:
          type: string
          description: The ID of the user from your platform
          minLength: 1
          maxLength: 255
          example: 123456789123456789abcdefg
    InternalUserId:
      type: object
      properties:
        payfare_id:
          type: string
          format: uuid
          description: Payfare (EmFi) unique id.
          example: 1bc25ac6-abae-46aa-9b25-329f1ac50ae5
    RewardTierField:
      type: object
      properties:
        reward_tier:
          type: string
          description: The reward category under which this user falls under.
          minLength: 1
          maxLength: 255
          example: gold
    UserRequest:
      allOf:
        - $ref: "#/components/schemas/ExternalUserId"
        - $ref: "#/components/schemas/RewardTierField"
        - properties:
            first_name:
              type: string
              description: The first name of the user.
              minLength: 1
              maxLength: 255
              example: John
            middle_name:
              type: string
              minLength: 0
              maxLength: 255
              example: ''
            last_name:
              type: string
              description: The last name of the user.
              minLength: 1
              maxLength: 255
              example: Smith
            embossed_name:
              type: string
              description: >-
                Name printed on the card. If not provided then EmFi will derive.
                <br/>
                The length of the name printed on the card is restricted to 21 characters
                including the space between the first and last name.
                In addition, no accented characters are allowed within the embossed name.
                <br/>
                If the embossed_name within the request is not provided,
                then EmFi will derive the embossed name applying the following rules:

                - If length[first_name] + length[last_name] <= 20 then
                    - embossed_name = concatenate first_name, space, last_name
                      else if length [first_name initial] + length[last_name] <= 20 then
                    - embossed_name = concatenate first_name initial, space, last_name
                      else
                    - embossed_name = concatenate first_name, space, truncate(last_name to 18 characters)

                  All accented characters will be replaced with the non-accented equivalent.
              minLength: 1
              maxLength: 21
              example: John Smith
            phone_number:
              type: string
              description: The user's phone number with the international calling code. (E.164 format)
              minLength: 7
              maxLength: 15
              example: '+11234567891'
            email:
              type: string
              description: The email of the user. Must be unique.
              minLength: 3
              maxLength: 255
              example: john.smith@email.com
            rewards_eligible:
              type: boolean
              example: false
            address:
              description: The residential address of the user.
              allOf:
                - $ref: "#/components/schemas/Address"
            date_of_birth:
              type: string
              description: The user's date of birth in YYYY-MM-DD (ISO-8601) date format.
              format: date
              minLength: 10
              maxLength: 10
              example: 1990-01-01
            express_consent:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    description: The name of the terms or agreement that was presented to the user.
                    example: Example Program User Agreement
                  accepted:
                    oneOf:
                      - type: boolean
                      - type: integer
                        enum: [0, 1]
                    description: A boolean which determines whether or not the user accepted the documentation.
                    example: true
                  date:
                    type: string
                    description: The date on which the user accepted the presented documented.
                    format: date
                    example: 2018-01-01
              description: >-
                An array containing the name and the dates of the accepted
                agreements for the card program offered by EmFi.
            ssn:
              type: string
              minLength: 9
              maxLength: 10
              example: "123456789"
            tins:
              type: array
              description: Each tin belonging to the user.
              items:
                type: object
                properties:
                  jurisdiction:
                    type: string
                    example: Maldives
                  tin:
                    type: string
                    example: "1234-334-333"
                  no_tin_reason:
                    type: string
                    nullable: true
                    example: ''    # Can't have a null example in request body.
            ship_type:
              type: string
              example: mail
            device_info:
              type: object
              properties:
                device_model:
                  type: string
                  example: model
                device_os_name:
                  type: string
                  example: osname
                device_os_version:
                  type: string
                  example: "123.45"
                cpu_abi:
                  type: string
                  example: ARM
                ip_address:
                  type: string
                  example: "0.0.0.0"
                public_ip_address:
                  type: string
                  example: "0.0.0.0"
            preferred_language:
              type: string
              description: The preferred ISO 639-1 standard language code of the user.
              example: en-us
            metadata:
              type: object
              description: Any metadata that needs to be attached.
              nullable: true
              example: {
                key: value
              }
            mock_response:
              type: boolean
              description: Used for mocking responses in a test environment.
          required:
            - first_name
            - last_name
            - email
            - phone_number
            - address
            - date_of_birth
            - external_id
            - express_consent
            - ssn
            - ship_type
    UserResponse:
      allOf:
        - $ref: "#/components/schemas/UserRequest"
        - $ref: "#/components/schemas/InternalUserId"
        - properties:
            created_at:
              type: string
              format: date-time
              description: ISO 8601 datetime
              example: 2020-03-16T18:38:52+00:00
            status:
              type: string
              enum:
                - pending-activation
                - active
                - inactive
                - suspended
                - closed
              example: pending-activation
            wallet_status:
              type: string
              description: Refer to Wallet status table.
              enum:
                - active
                - pending
              example: pending
    PartialPaymentResponse:
      type: object
      properties:
        net_amount:
          type: number
          example: 1000
        created_at:
          type: string
          description: ISO-8601
          format: date-time
          example: "2023-05-25T04:25:12+00:00"
        currency_code:
          type: string
          example: USD
    SuccessfulRequest:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: ''
    ErrorMessage:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: ''
  parameters:
    InternalUserId:
      name: payfare_id
      in: path
      description: The UUID of the Payfare (EmFi) user.
      schema:
        type: string
        format: uuid
        example: 8c0e91a3-2c9b-4bad-8ece-38a7de460d3c
      required: true
    PayoutId:
      name: payout_id
      in: path
      schema:
        type: string
        format: uuid
        example: 72056c22-eac4-4a2a-9b19-815a39392906
      required: true
    CardId:
      name: card_id
      in: path
      description: The UUID of the EmFi card.
      schema:
        type: string
        format: uuid
        example: c6fe6212-c9b1-4477-9aac-55560b591083
      required: true
    RecipientId:
      name: recipient_id
      in: path
      description: The UUID of the EmFi recipient.
      schema:
        type: string
        format: uuid
        example: 8ab683c8-ff22-45bc-9f7b-362e19a5ef91
      required: true
    AchId:
      name: ach_id
      in: path
      description: The UUID of the account transfer
      schema:
        type: string
        format: uuid
        example: a3df5efd-03b0-4402-ad97-cc5c0367bc9c
      required: true
    FromDateTime:
      name: from_datetime
      in: query
      description: >-
        The starting UTC datetime in ISO 8601 format from which the
        transactions will be filtered from.
      schema:
        type: string
        example: '2023-05-01T08:00:00'
    ToDateTime:
      name: to_datetime
      in: query
      description: >-
        The ending UTC datetime in ISO 8601 format from which the
        transactions will be filtered from.
      schema:
        type: string
        example: '2023-05-02T23:59:59'
    ClientKey:
      name: X-PFClient-Key
      in: header
      schema:
        type: string
        example: 126eeb7c-d130-45c4-b3db-280f01aebe20
      required: true
      description: 'API Key'
    ClientSecret:
      name: X-PFClient-Secret
      in: header
      schema:
        type: string
        example: 225e2b4b-7cb7-4267-a65c-097ea541b21f
      required: true
      description: 'API Secret'
  responses:
    400UserNotFound:
      description: >-
        When this error occurs, it means that the Payfare (EmFi) ID provided in the request
        does not match with any user in the card program.
        Notice the **10050** error code.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorMessage"
              - properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                          example: payfare_id
                        code:
                          type: integer
                          enum: [10050]
                          example: 10050
                        message:
                          type: string
                          enum: [User not found]
                          example: User not found
                      description: User does not exist in our system.
    401InvalidAuthorization:
      description: >-
        When this error response occurs, it means that either the **X-PFClient-Key** or
        the **X-PFClient-Secret** is invalid.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorMessage"
              - properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                          example: ""
                        code:
                          type: integer
                          enum: [11000]
                          example: 11000
                        message:
                          type: string
                          enum: [Invalid authorization]
                          example: Invalid authorization
    403AccessForbidden:
      description: >-
        When this error response occurs, it means that the **X-PFClient-Key**
        used for this request does not have the required permissions to access this endpoint.
        If you do not have a separate **X-PFClient-Key** for the BaaS endpoints,
        please contact EmFi and it will be provisioned for you.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorMessage"
              - properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                          example: ""
                        code:
                          type: integer
                          enum: [11403]
                          example: 11403
                        message:
                          type: string
                          enum: [Access Forbidden]
                          example: Access Forbidden
    404NoCompletedPayout:
      description: >-
        This error response occurs when the cardholder has **yet to receive a payout that has completed**.
        Note the unique **40071** error code.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorMessage"
              - properties:
                  errors:
                    type: array
                    items:
                      properties:
                        field:
                          type: string
                          example: ""
                        code:
                          type: integer
                          enum: [40071]
                          example: 40071
                        message:
                          type: string
                          enum: [User does not have any completed payout]
                          example: User does not have any completed payout
    422CardUserMismatch:
      description: >-
        When this error occurs, it means that the **card_id** specified in URL path params
        does not belong to the **payfare_id** specified.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorMessage"
              - properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                          example: card_id
                        code:
                          type: integer
                          enum: [20080]
                          example: 20080
                        message:
                          type: string
                          enum: [Card user mismatch]
                          example: Card user mismatch
    422NoCardForPayout:
      description: >-
        This error is a result of accessing this endpoint before a card has been ordered for this user.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorMessage"
              - properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                          enum: [card]
                          example: "card"
                        code:
                          type: integer
                          enum: [40050]
                          example: 40050
                        message:
                          type: string
                          enum: [No card for payout]
                          example: No card for payout
  examples:
    InvalidCardStatusTransitionError:
      value: {
        "status": "error",
        "errors": [
          {
            "code": 20040,
            "message": "Invalid card status transition",
            "field": ""
          }
        ],
        "message": ""
      }
      description: >-
        This error occurs when an invalid status is sent in the request.
    UserNotFoundError:
      value: {
        "status": "error",
        "errors": [
          {
            "code": 10050,
            "message": "User not found",
            "field": ""
          }
        ],
        "message": ""
      }
      description: >-
        When this error occurs, it means that the Payfare (EmFi) ID provided
        in the request does not match with any user in the card program.
    InvalidFormatError:
      value: {
        "status": "error",
        "errors": [
          {
            "code": 2078,
            "message": "Invalid format",
            "field": "account_number"
          }
        ],
        "message": ""
      }
      description: Also 400 can occur due to invalid format of some of the fields.
paths:
  /v1/users/create-application:
    post:
      x-group-name: B2B Endpoints
      x-proxy-name: Create a User
      summary: Create a User
      description: >-
        This endpoint allows partners to create a new user within the Payfare (EmFi) system.
        When invoked, it registers a user account with the provided details and
        initiates any necessary verification steps based on EmFi's onboarding requirements.
        <br/>
        This endpoint initiates the full onboarding process for a new user,
        including completing KYC (Know Your Customer) requirements and ordering a card.
        Upon successful request, EmFi will handle all steps in the process to ensure
        the user is onboarded and their card is ordered automatically.
      operationId: create_user_application
      parameters:
        - $ref: "#/components/parameters/ClientKey"
        - $ref: "#/components/parameters/ClientSecret"
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/UserRequest"
                - properties:
                    shipping_address:
                      $ref: "#/components/schemas/Address"
      responses:
        '200':
          description: 200 Response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessfulRequest"
                  - properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: "#/components/schemas/UserResponse"
              examples:
                Result:
                  value: {
                    "status": "success",
                    "data": {
                      "user": {
                        "payfare_id": "7585cad9-338f-40a9-9a82-e3349605eace",
                        "first_name": "Assaassa",
                        "last_name": "K",
                        "phone_number": "+18918350508",
                        "date_of_birth": "1975-02-23",
                        "created_at": "2024-10-30T16:13:55+00:00",
                        "status": "pending-activation",
                        "wallet_status": null,
                        "reason_code": null,
                        "reward_tier": "Green",
                        "metadata": {
                          "test": "Test"
                        },
                        "email": "Marley46@yahoo.com",
                        "middle_name": null,
                        "embossed_name": "Assaassa K",
                        "external_id": "4b5e8d61-3112-4305-8e1a-167dd839cad4",
                        "express_consent": [
                          {
                            "id": 34618,
                            "payfare_id": "7585cad9-338f-40a9-9a82-e3349605eace",
                            "name": "Agreement A",
                            "accepted": 1,
                            "date": "2023-11-01T00:00:00+00:00",
                            "created_at": "2024-10-30T16:13:55.594000+00:00",
                            "updated_at": "2024-10-30T16:13:55.594000+00:00"
                          },
                          {
                            "id": 34619,
                            "payfare_id": "7585cad9-338f-40a9-9a82-e3349605eace",
                            "name": "Agreement B",
                            "accepted": 1,
                            "date": "2024-11-01T00:00:00+00:00",
                            "created_at": "2024-10-30T16:13:55.600000+00:00",
                            "updated_at": "2024-10-30T16:13:55.600000+00:00"
                          }
                        ],
                        "preferred_language": "en-ca",
                        "address": {
                          "address_line1": "111 Lafayette Road",
                          "address_line2": null,
                          "address_line3": null,
                          "address_line4": null,
                          "city": "Syracuse",
                          "region": "NY",
                          "country_code": "us",
                          "postal_code": "13205"
                        },
                        "last_login": null,
                        "ssn_last_four": "2499",
                        "id_number": "ID-4052",
                        "id_type": "DL",
                        "country_of_issue": "US",
                        "region_of_issue": "ON",
                        "expiry_date": "2025-03-03",
                        "occupation": "Architecture and engineering occupations",
                        "job_level": null,
                        "ship_type": "mail"
                      }
                    },
                    "message": ""
                  }
        '400':
          description: 400 Response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorMessage"
                  - properties:
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            field:
                              type: string
                              example: external_id
                            code:
                              type: integer
                              enum: [10010, 10020, 10030, 10040, 10051, 10055, 2078]
                              example: 10010
                            message:
                              type: string
                              enum: 
                                - User already exists
                                - Required Field
                                - Invalid Format
                                - Invalid value
                                - Invalid parameter encoding
                                - User is closed by Payfare
                                - Request format is not valid
                              example: User already exists
              examples:
                UserAlreadyExists:
                  summary: The user already exists.
                  value: {
                      "status": "error",
                      "errors": [
                          {
                              "code": 10010,
                              "message": "User already exists",
                              "field": ""
                          }
                      ],
                      "message": ""
                  }
                MultipleValidationErrors:
                  summary: Request had multiple validation errors.
                  value: {
                      "status": "error",
                      "errors": [
                        {
                          "code": 10010,
                          "message": "User already exists",
                          "field": "external_id",
                        },
                        {
                          "code": 10020,
                          "message": " Required field missing",
                          "field": "first_name",
                        }
                      ]
                  }
                AllValidationErrors:
                  value: {
                    "status": "error",
                    "errors": [
                      {
                        "code": 10010,
                        "message": "User already exists",
                        "field": "external_id",
                      },
                      {
                        "code": 10020,
                        "message": "Required Field",
                        "field": "first_name",
                      },
                      {
                        "code": 10030,
                        "message": "Invalid Format",
                        "field": "embossed_name",
                      },
                      {
                        "code": 10040,
                        "message": "Invalid value",
                        "field": "region",
                      },
                      {
                        "code": 10051,
                        "message": "Invalid parameter encoding",
                        "field": "address_line1",
                      },
                      {
                        "code": 10055,
                        "message": "User is closed by Payfare",
                        "field": "external_id",
                      },
                      {
                        "code": 2078,
                        "message": "Request format is not valid",
                        "field": "",
                      }
                    ],
                    "message": ""
                  }
        '401':
          $ref: "#/components/responses/401InvalidAuthorization"
      deprecated: false
  /v1/users/{payfare_id}:
    get:
      x-group-name: B2B Endpoints
      x-proxy-name: Get a User
      summary: Get a User
      description: >-
        This endpoint retrieves detailed information about a specified user on the platform.
        By calling this endpoint, partners can access user-specific data such as profile details, account status.
      operationId: get_user
      parameters:
        - $ref: "#/components/parameters/InternalUserId"
        - $ref: "#/components/parameters/ClientKey"
        - $ref: "#/components/parameters/ClientSecret"
      responses:
        '200':
          description: 200 Response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessfulRequest"
                  -  properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/UserResponse"
                          - properties:
                              auto_disbursement:
                                type: boolean
                                description: >-
                                  true or false depending on the user's decision. If the value was not stored, it returns None.
                                nullable: true
                                example: true
              examples:
                Result:
                  value: {
                    "status": "success",
                    "data": {
                      "first_name": "Able",
                      "middle_name": null,
                      "last_name": "Person",
                      "embossed_name": "Able Person",
                      "email": "aperson@example.com",
                      "phone_number": "+19995551234",
                      "address": {
                        "address_line1": "67 mowat rd",
                        "address_line2": "suite 100",
                        "city": "Vancouver",
                        "region": "BC",
                        "postal_code": "B1A1A1",
                        "country_code": "CA"
                      },
                      "external_id": "PartnerID-123456",
                      "created_at": 1532973790,
                      "payfare_id": "ce49eba7-b746-4cef-ac3a-79d2d6bff274",
                      "express_consent": [
                        {
                          "name": "Cardholder Agreement",
                          "date": "2018-09-10",
                          "accepted": true
                        },
                        {
                          "name": "Drivers Agreement",
                          "date": "2018-09-10",
                          "accepted": true
                        }
                      ],
                      "status": "pending-activation",
                      "reward_tier": "green"
                    },
                    "message": ""
                  }
        '400':
          $ref: "#/components/responses/400UserNotFound"
        '401':
          $ref: "#/components/responses/401InvalidAuthorization"
      deprecated: false
    put:
      x-group-name: B2B Endpoints
      x-proxy-name: Update a User
      summary: Update a User
      description: >-
        This endpoint allows for updating the user's information such as their reward tiers.
      operationId: update_user
      parameters:
        - $ref: "#/components/parameters/InternalUserId"
        - $ref: "#/components/parameters/ClientKey"
        - $ref: "#/components/parameters/ClientSecret"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewardTierField"
      responses:
        '200':
          description: 200 Response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessfulRequest"
                  - properties:
                      data:
                        $ref: "#/components/schemas/UserResponse"
              examples:
                Result:
                  value: {
