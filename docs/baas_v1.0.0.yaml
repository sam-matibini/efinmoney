  /baas/users/{payfare_id}/atm-locations:
    get:
      x-group-name: BaaS Endpoints
      x-proxy-name: ATM Finder
      summary: ATM Finder
      description: >-
        Use this BaaS endpoint to get the ATM locations near the specified
        longitude and latitude.
      operationId: find_atms
      parameters:
        - $ref: "#/components/parameters/InternalUserId"
        - name: lat
          in: query
          description: The latitude of the place to find nearest atms
          required: true
          schema:
            type: number
            format: float
            example: 38.9
        - name: lng
          in: query
          description: The longitude of the place to find nearest atms
          required: true
          schema:
            type: number
            format: float
            example: 20.2
        - name: radius
          in: query
          description: The radius till which nearest atms should be found
          schema:
            type: number
            format: float
            example: 100
        - $ref: "#/components/parameters/ClientKey"
        - $ref: "#/components/parameters/ClientSecret"
      responses:
        '200':
          description: Successful request
