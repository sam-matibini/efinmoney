        content:
          application/json:
            schema:
              type: object
              required:
                - external_payment_id
                - amount
                - currency_code
              properties:
                external_payment_id:
                  type: string
                  description: The unique payout identifier from the client
                  format: uuid
                  example: ab333f19-22c3-4ba1-86fd-7e50f5c20ab9
                amount:
                  type: number
                  description: Payout amount
                  format: float
                  example: 1000
                currency_code:
                  type: string
                  description: ISO 4217 currency codes
                  example: USD
                description:
                  type: string
                  description: Partner defined field
                  minLength: 0
                  maxLength: 255
                  example: ""
                metadata:
                  type: object
                  description: Partner defined field
                  example: {
                    key: value
                  }
      responses:
        '200':
          description: 200 Response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessfulRequest"
                  - properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/PartialPaymentResponse"
                          - properties:
                              payout_id:
                                type: string
                                format: uuid
                                example: 13e0457f-5bcf-420c-8268-d40332b3d1c2
                              reason_codes:
                                type: string
                                example: "70010"
                              status:
                                type: string
                                enum:
                                  - pending
                                  - failed
                                  - complete
                                  - cancelled
                                example: pending
                              description:
                                type: string
                                nullable: true
                                example: null
                              metadata:
                                type: object
                                description: Any metadata that needs to be attached.
                                nullable: true
                                example: {
                                  key: value
                                }
        '201':
          description: In case payout is already processed and completed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessfulRequest"
                  - properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/PartialPaymentResponse"
                          - properties:
                              payout_id:
                                type: string
                                format: uuid
                                example: 13e0457f-5bcf-420c-8268-d40332b3d1c2
                              reason_codes:
                                type: string
                                example: "70010"
                              status:
                                type: string
                                enum:
                                  - pending
                                  - failed
                                  - complete
                                  - cancelled
                                example: complete
                              metadata:
                                type: object
                                description: Any metadata that needs to be attached.
                                nullable: true
                                example: {
                                  key: value
                                }
              examples:
                PaymentProcessedAndFailed:
                  description: In case payout is already processed and failed
                  value: {
                    "status": "success",
                    "data": {
                      "payout_id": "9f5f0fa6-fe52-4dd6-9dd1-be7a6484f9f3",
                      "net_amount": 100000,
                      "status": "failed",
                      "reason_codes": "70010",
                      "created_at": "2023-11-13T16:03:44+00:00",
                      "currency_code": "CAD",
                      "metadata": null
                    },
                    "message": ""
                  }
        '400':
          description: 400 Response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorMessage"
                  - properties:
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            field:
                              type: string
                              example: ""
                            code:
                              type: integer
                              enum: [
                                10010, 10020, 10030, 10040, 70010, 70030, 70040, 70050, 70060, 70100, 70090,
                                008001, 40050, 008008, 9999, 002024, 20126, 1011]
                              example: 10010
                            message:
                              type: string
                              enum:
                                - Value must be unique
                                - Required field missing
                                - Invalid length or format
                                - Invalid value
                                - Invalid Status (Transaction not Allowed)
                                - Transaction Limit Exceeded
                                - Expired Card
                                - Suspected Fraud
                                - Lost Card
                                - Max Balance
                                - Load Limit Exceeded
                                - Upstream Error
                                - No card for payout
                                - Provider Timeout
                                - System Error
                                - Connect Failure
                                - Timeout
                                - external_payment_id must be unique
                              example: Value must be unique
                            payout_id:
                              type: string
                              format: uuid
              examples:
                ValueMustBeUniqueError:
                  description: Field which must be unique across the system, so a record could not be created.
                  value: {
                    "status": "error",
                    "errors": [
                      {
                        "code": 10010,
                        "message": "Value must be unique"
                      }
                    ],
                    "message": ""
                  }
                RequiredFieldMissingError:
                  description: Field which must be in the request but is missing.
                  value: {
                    "status": "error",
                    "errors": [
                      {
                        "code": 10020,
                        "message": "Required field missing"
                      }
                    ],
                    "message": ""
                  }
                InvalidLengthOrFormatError:
                  description: Field does not conform to the required formatting.
                  value: {
                    "status": "error",
                    "errors": [
                      {
                        "code": 10030,
                        "message": "Invalid length or format"
                      }
                    ],
                    "message": ""
                  }
                InvalidValueError:
                  description: Field is not one of the defined values.
                  value: {
                    "status": "error",
                    "errors": [
                      {
                        "code": 10040,
                        "message": "Invalid value"
                      }
                    ],
                    "message": ""
                  }
                InvalidStatusError:
                  description: >-
                    Card status could be moved to an unpayable status such as 'Suspended' due to a Fraud Block.
                    Wait for card status to change. Can be retried by EmFi or client.
                  value: {
                    "status": "error",
                    "errors": [
                      {
                        "code": 70010,
                        "message": "Invalid Status (Transaction not Allowed)"
                      }
                    ],
                    "message": ""
                  }
                TransactionLimitExceededError:
                  description: >-
                    A load would be blocked when the frequency of the call to load a card
                    has exceeded the set amount allotted to a driver.
                    Can be retried when velocity limits cool.
                    Example: 30 loads per day in a 24 hour rolling period when the limit is set to 25.
                  value: {
                    "status": "error",
                    "errors": [
                      {
                        "code": 70030,
                        "message": "Transaction Limit Exceeded"
                      }
                    ],
                    "message": ""
                  }
                ExpiredCardError:
                  description: >-
                    Wait till the card is reissued and another card is added to the user.
                    Can be retried by EmFi or client.
                  value: {
                    "status": "error",
                    "errors": [
                      {
                        "code": 70040,
                        "message": "Expired Card"
                      }
                    ],
                    "message": ""
                  }
                SuspectedFraudError:
                  description: >-
                    Transaction blocked due to fraud. Retry at a later time.
                    Every 60 min or after 24 hrs.
                  value: {
                    "status": "error",
                    "errors": [
                      {
                        "code": 70050,
                        "message": "Suspected Fraud"
                      }
                    ],
                    "message": ""
                  }
                LostCardError:
                  description: >-
                    Retry when card status is in a payable status.
                    Can be retried by EmFi or client.
                  value: {
                    "status": "error",
                    "errors": [
                      {
                        "code": 70060,
                        "message": "Lost Card"
                      }
                    ],
                    "message": ""
                  }
                MaxBalanceError:
                  description: Retry when funds have been moved off of card.
                  value: {
                    "status": "error",
                    "errors": [
                      {
                        "code": 70100,
                        "message": "Max Balance",
                      }
                    ],
                    "message": ""
                  }
                LoadLimitExceededError:
                  description: >-
                    Max daily load limit exceeded in a rolling 24 hr period.
                    Retry at a later time. Every 60 min or after 24 hrs.
                  value: {
                    "status": "error",
                    "errors": [
                      {
                        "code": 70090,
                        "message": "Load Limit Exceeded"
                      }
                    ],
                    "message": ""
                  }
                UpstreamError:
                  description: Retry every 60 min.
                  value: {
                    "status": "error",
                    "errors": [
                      {
                        "code": 80001,
                        "message": "Upstream Error"
                      }
                    ],
                    "message": ""
                  }
                NoCardForPayoutError:
                  description: User has no card assigned for payout.
                  value: {
                    "status": "error",
                    "errors": [
                      {
                        "code": 40050,
                        "message": "No card for payout"
                      }
                    ],
                    "message": ""
                  }
                ProviderTimeoutError:
                  description: Retry every 15 min. Retry with same transaction_id
                  value: {
                    "status": "error",
                    "errors": [
                      {
                        "code": 008008,
                        "message": "Provider Timeout"
                      }
                    ],
                    "message": ""
                  }
                SystemError:
                  description: Retry every 15 min. Retry with same transaction_id
                  value: {
                    "status": "error",
                    "errors": [
                      {
                        "code": 9999,
                        "message": "System Error"
                      }
                    ],
                    "message": ""
                  }
                ConnectFailure:
                  description: Retry every 15 min
                  value: {
                    "status": "error",
                    "errors": [
                      {
                        "code": 002024,
                        "message": "Connect Failure"
                      }
                    ],
                    "message": ""
                  }
                DuplicatePaymentRequest:
                  description: Duplicate payment request.
                  value: {
                    "status": "error",
                    "errors": [
                      {
                        "code": 10011,
                        "message": "external_payment_id must be unique",
                        "field": "external_payment_id",
                        "payout_id": "70216fb2-c825-4316-8511-ce3a59434d5e"
                      }
                    ],
                    "message": ""
                  }
        '401':
          $ref: "#/components/responses/401InvalidAuthorization"
      deprecated: false
  /v1/payouts/{payout_id}:
    get:
      x-group-name: B2B Endpoints
      x-proxy-name: Check Payment Status
      summary: Check Payment Status
      description: >-
        This endpoint allows users to retrieve the current status of
        a specific payout using its unique identifier (payout_id).
        By providing the payout_id, users can access detailed information
        regarding the payout's status, including whether it is pending, completed, or failed.
        This functionality is essential for tracking the status of payouts.
      operationId: check_payment_status
      parameters:
        - $ref: "#/components/parameters/PayoutId"
        - $ref: "#/components/parameters/ClientKey"
        - $ref: "#/components/parameters/ClientSecret"
      responses:
        '200':
          description: 200 Response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessfulRequest"
                  - properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/PartialPaymentResponse"
                          - properties:
                              payout_id:
                                type: string
                                description: >-
                                  * If the payout_id is provided, then the payout status
                                    and a list of earnings included in the payout will be returned.
                                  * If the payout_id is not provided (i.e. null) the list of unpaid earnings
                                    will be returned and the remaining fields will be null.
                                format: uuid
                                example: 13e0457f-5bcf-420c-8268-d40332b3d1c2
                              status:
                                type: string
                                description: >-
                                  <table>
                                    <thead>
                                      <th>Status</th>
                                      <th>Meaning</th>
                                    </thead>
                                    <tr>
                                      <td>processing</td>
                                      <td>request has been accepted and a payout_id has been created</td>
                                    </tr>
                                    <tr>
                                      <td>failed</td>
                                      <td>The payout transaction failed.  The EmFi platform will retry up to 10 times</td>
                                    </tr>
                                    <tr>
                                      <td>complete</td>
                                      <td>The net_amount was loaded to the card</td>
                                    </tr>
                                    <tr>
                                      <td>cancelled</td>
                                      <td>The payment has been cancelled and all the associated earnings have been voided</td>
                                    </tr>
                                  </table>
                                enum:
                                  - processing
                                  - failed
                                  - complete
                                  - cancelled
                                example: processing
                              earnings:
                                type: object
                                properties:
                                  earnings_id:
                                    type: string
                                    description: List of earnings included in the payout
                                    format: uuid
                                    example: 1b380f06-46dc-40d9-a9af-5d8ae0030fde
                                  net_amount:
                                    type: number
                                    example: 100
                                  metadata:
                                    type: object
                                    description: Any metadata that needs to be attached.
                                    nullable: true
                                    example: {
                                      key: value
                                    }
                                  description:
                                    type: string
                                    nullable: true
                                    example: ''
                                  external_payment_id:
                                    type: string
                                    format: uuid
                                    example: ab333f19-22c3-4ba1-86fd-7e50f5c20ab9
                                  created_at:
                                    type: integer
                                    example: 1532979333
        '400':
          description: Payout does not exist in our system.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorMessage"
                  - properties:
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            field:
                              type: string
                              example: ""
                            code:
                              type: integer
                              enum: [40070]
                              example: 40070
                            message:
                              type: string
                              enum: [Payout does not exist]
                              example: Payout does not exist
      deprecated: false
