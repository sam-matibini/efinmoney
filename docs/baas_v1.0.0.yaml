                        type: object
                        properties:
                          card:
                            type: object
                            properties:
                              card_id:
                                type: string
                                description: A unique identifier (UUID) representing the card for the program.
                                format: uuid
                                example: 047d70e1-080e-4289-9733-18671260a932
                              proxy:
                                type: string
                                description: A unique numerical identifier representing the card for the program.
                                example: "110195062455837"
                              brand:
                                type: string
                                description: The network name under which the card operates in (Visa, Mastercard, American Express)
                                enum:
                                  - Visa
                                  - Mastercard
                                  - American Express
                                example: Visa
                              created:
                                type: string
                                description: The date when the card was ordered.
                                format: date-time
                                example: 2023-03-25T03:04:56+00:00
                              currency:
                                type: string
                                description: The currency under which the card operates in.
                                example: USD
                              exp_month:
                                type: string
                                description: The month at which the card will expire.
                                example: "01"
                              exp_year:
                                type: string
                                description: The year at which the card will expire.
                                example: "2029"
                              last4:
                                type: string
                                description: The last four digits of the card.
                                example: "0436"
                              balance:
                                type: number
                                description: The balance on the card.
                                example: 0.00
                              status:
                                type: string
                                description: >-
                                  The status of the card which can be one of the following:
                                  pre-active, in-transit, closed, damaged, stolen, lost, suspended, active, frozen.
                                enum:
                                  - pre-active
                                  - in-transit
                                  - closed
                                  - damaged
                                  - stolen
                                  - lost
                                  - suspended
                                  - active
                                  - frozen
                                example: active
                              bin:
                                type: string
                                description: The first four to six numbers on the card that identifies the issuer.
                                example: "601999"
                              metadata:
                                type: object
                                description: Metadata JSON payload that was optionally sent by the partner during card order.
                                nullable: true
                                example: null
                              virtual:
                                type: boolean
                                description: A boolean which determines if the card is virtual or not.
                                example: false
                              expired:
                                type: boolean
                                description: A boolean which determines if the card has_expired or not.
                                example: false
                              expiring:
                                type: boolean
                                description: A boolean which determines if the card is close to the date of expiry (within 90 days).
                                example: false
                              reissue_limit_reached:
                                type: boolean
                                description: >-
                                  A boolean that determines if the cardholder has reached the reissue limit.
                                  EmFi imposes a rolling weekly and daily limit with regards to how many times a cardholder can reissue their card.
                                  If this value is true, the cardholder cannot reissue their card until this value becomes false.
                                example: false
                              profile_recently_updated:
                                type: boolean
                                description: >-
                                  A boolean which determines if the user has recently updated their profile.
                                  If an update occurred in the last 24 hours,
                                  it will return true and the cardholder cannot reissue their card until this value becomes false.
                                example: false
                              activation_date:
                                type: string
                                description: The datetime of when the card was activated.
                                format: date-time
                                nullable: true
                                example: null
                              reissuable:
                                type: boolean
                                description: A boolean which determines if the card can be reissued.
                                example: false
        '400':
          $ref: "#/components/responses/400UserNotFound"
        '422':
          $ref: "#/components/responses/422NoCardForPayout"
      deprecated: false
  /baas/users/{payfare_id}/cards/{card_id}/status:
    get:
      x-group-name: BaaS Endpoints
      x-proxy-name: Get Card Status
      summary: Get Card Status
      description: >-
        Use this endpoint to retrieve the card status of a particular card
        associated with the cardholder.
      operationId: get_card_status
      parameters:
        - $ref: "#/components/parameters/InternalUserId"
        - $ref: "#/components/parameters/CardId"
        - $ref: "#/components/parameters/ClientKey"
        - $ref: "#/components/parameters/ClientSecret"
      responses:
        '200':
          description: The **status** field inside the data key represents the status of the card.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessfulRequest"
                  - properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: closed
        '400':
          $ref: "#/components/responses/400UserNotFound"
        '401':
          $ref: "#/components/responses/401InvalidAuthorization"
        '403':
          $ref: "#/components/responses/403AccessForbidden"
        '422':
          $ref: "#/components/responses/422CardUserMismatch"
      deprecated: false
    put:
      x-group-name: BaaS Endpoints
      x-proxy-name: Set Card Status
      summary: Set Card Status
      description: >-
        Use this BaaS endpoint to lock and unlock the cardholder's card upon
        their request. This same endpoint is also used to mark a card as lost,
        stolen and damaged.
      operationId: set_card_status
      parameters:
        - $ref: "#/components/parameters/InternalUserId"
        - $ref: "#/components/parameters/CardId"
        - $ref: "#/components/parameters/ClientKey"
        - $ref: "#/components/parameters/ClientSecret"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: >-
                    <p>The status the cardholder wishes to set the card to.</p>

                    <p>The table below contains the current allowable card status changes along with their descriptions:</p>

                    <table>
                        <thead>
                            <tr>
                                <th>Card Status</th>
                                <th>Description</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>active</td>
                                <td>All transactions allowed.</td>
                            </tr>
                            <tr>
                                <td>frozen</td>
                                <td>
                                  Withdrawals and purchases are blocked.
                                  Cardholder has the option of switching the card into an unlocked state ("<strong>active</strong>") from this status.
                                </td>
                            </tr>
                            <tr>
                                <td>lost</td>
                                <td>
                                  Use this status for when the user has marked their card as lost.
                                  Withdrawals and purchases are blocked. Once a card is marked as <strong>lost</strong>,
                                  EmFi does not allow the card to be reactivated.
                                </td>
                            </tr>
                            <tr>
                                <td>damaged</td>
                                <td>
                                  Use this status for when the user has marked their card as damaged.
                                  Withdrawals and purchases are blocked. Once a card is marked as <strong>damaged</strong>,
                                  EmFi does not allow the card to be reactivated.
                                </td>
                            </tr>
                            <tr>
                                <td>stolen</td>
                                <td>
                                  Use this status for when the user has marked their card as stolen.
                                  Withdrawals and purchases are blocked.
                                  Once a card is marked as <strong>stolen</strong>, EmFi does not allow the card to be reactivated.
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <blockquote>
                        <h3>📘 Card Status Terminology</h3>
                        <p>The <strong>frozen</strong> status is what EmFi uses to refer to a card that is commonly referred to as <strong>locked</strong>.
                        In same way, an <strong>active</strong> card is a card that is commonly referred to as <strong>unlocked</strong>.</p>
                    </blockquote>
                  enum:
                    - active
                    - frozen
                    - lost
                    - damaged
                    - stolen
                  example: frozen
                report_date:
                  type: string
                  description: >-
                    The date on which the cardholder has requested to make this
                    status change in (YYYY-MM-DD) format.
                  format: date
                  example: 2023-06-30
      responses:
        '200':
          description: When the card status has successfully changed, you will receive this response.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessfulRequest"
                  - properties:
                      data:
                        type: object
                        example: {}
        '400':
          $ref: "#/components/responses/400UserNotFound"
        '401':
          $ref: "#/components/responses/401InvalidAuthorization"
        '403':
          $ref: "#/components/responses/403AccessForbidden"
        '422':
          description: 422 Responses
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorMessage"
                  - properties:
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            field:
                              type: string
                              example: card_id
                            code:
                              type: integer
                              enum: [20080, 20040]
                              example: 20080
                            message:
                              type: string
                              enum:
                                - Card user mismatch
                                - Invalid card status transition
                              example: Card user mismatch
              examples:
                InvalidCardStatusTransition:
                  $ref: "#/components/examples/InvalidCardStatusTransitionError"
                CardUserMismatch:
                  value: {
                    "status": "error",
                    "errors": [
                        {
                            "code": 20080,
                            "message": "Card user mismatch",
                            "field": "card_id"
                        }
                    ],
                    "message": ""
                  }
                  description: >-
                    This error occurs when sending in a **card_id** in the URL path params
                    that is not associated with the specified **payfare_id**
      deprecated: false
